name: Build Passenger App (Android)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-build-passenger
  cancel-in-progress: false

jobs:
  build:
    name: Build Sarix Go Passenger
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sarix-go-app
    env:
      EAS_PROJECT_ID: ${{ secrets.EAS_PASSENGER_PROJECT_ID }}
      EXPO_PUBLIC_YANDEX_JS_API_KEY: ${{ secrets.YANDEX_JS_API_KEY }}
      EXPO_PUBLIC_YANDEX_GEOCODER_KEY: ${{ secrets.YANDEX_GEOCODER_KEY }}
      EXPO_PUBLIC_YANDEX_MAPS_KEY: ${{ secrets.YANDEX_MAPS_KEY }}
      EXPO_PUBLIC_YANDEX_SUGGEST_KEY: ${{ secrets.YANDEX_SUGGEST_KEY }}
      EXPO_PUBLIC_YANDEX_SDK_API_KEY: ${{ secrets.YANDEX_SDK_API_KEY }}
      GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_PASSENGER_JSON_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: sarix-go-app/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 21.0.1
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Restore Firebase client configuration
        run: |
          test -n "$GOOGLE_SERVICES_JSON_B64" || { echo "::error::GOOGLE_SERVICES_PASSENGER_JSON_B64 is required"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > google-services.json
      - name: Validate Expo dependencies and project configuration
        run: |
          test -n "$EAS_PROJECT_ID" || { echo "::error::EAS_PASSENGER_PROJECT_ID is required"; exit 1; }
          test -n "$EXPO_PUBLIC_YANDEX_JS_API_KEY" || { echo "::error::YANDEX_JS_API_KEY is required"; exit 1; }
          npx expo install --check
          npx expo config --type public >/dev/null
      - name: Verify source
        run: npm run typecheck && npm run lint && npm test -- --ci
      - name: Build preview APK
        run: eas build --platform android --profile preview --non-interactive --wait
