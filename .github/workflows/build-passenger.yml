name: Build Passenger App (Android)

# Cloud EAS build. The app is no longer tied to a specific Expo account:
# `eas init` creates/links the project under whatever account the EXPO_TOKEN
# belongs to, then a cloud build runs on that account's (fresh) free quota.
# After it finishes, download the APK from https://expo.dev -> project -> Builds.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sarix-go-app/**'
      - '.github/workflows/build-passenger.yml'

jobs:
  build:
    name: Build Sarix Go Passenger
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sarix-go-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Align dependencies to Expo SDK
        run: npx expo install --fix

      - name: Create/link EAS project under your account
        run: eas init --non-interactive --force

      - name: Build APK (cloud, fresh free quota)
        run: eas build --platform android --profile preview --non-interactive
