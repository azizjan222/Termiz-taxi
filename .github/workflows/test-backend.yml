name: Test Backend

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'main.py'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'app/**'
      - 'main.py'
      - 'requirements.txt'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify imports and DB init
        run: |
          python -c "from app.config import BOT_TOKEN; print('Config OK')"
          python -c "from app.database import init_db; init_db(); print('DB schema OK')"
          python -c "from app.api.server import create_app; app = create_app(); print(f'API has {len(app.router.resources())} routes')"
        env:
          BOT_TOKEN: dummy_token_for_ci
          ADMIN_ID: 0
          DATABASE_URL: sqlite:///./data/test.db

      - name: Run unit tests (pytest)
        run: pytest -v

      - name: Test migration
        run: |
          rm -f data/test.db
          python -c "from app.migrate import run_migration; run_migration()"
        env:
          BOT_TOKEN: dummy_token_for_ci
          ADMIN_ID: 0
          DATABASE_URL: sqlite:///./data/test.db
