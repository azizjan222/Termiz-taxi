name: Daily DB Backup (Postgres)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate backup configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL secret is required; no backup was created"; exit 1; }
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::DATABASE_URL must be PostgreSQL for this workflow"; exit 1 ;;
          esac

      - name: Dump and verify database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          URL="${DATABASE_URL/postgres:\/\//postgresql://}"
          ts=$(date -u +%Y%m%d-%H%M%S)
          mkdir -p backups
          docker run --rm postgres:17.5 pg_dump --no-owner --no-privileges "$URL" \
            | gzip -9 > "backups/sarixgo-$ts.sql.gz"
          test -s "backups/sarixgo-$ts.sql.gz"
          gzip -t "backups/sarixgo-$ts.sql.gz"
          sha256sum "backups/sarixgo-$ts.sql.gz" > "backups/sarixgo-$ts.sql.gz.sha256"

      - name: Restore verification in disposable PostgreSQL
        run: |
          set -euo pipefail
          docker run -d --rm --name sarixgo-restore \
            -e POSTGRES_PASSWORD=restore-test postgres:17.5
          trap 'docker stop sarixgo-restore >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            docker exec sarixgo-restore pg_isready -U postgres && break
            sleep 1
          done
          docker exec sarixgo-restore pg_isready -U postgres
          gunzip -c backups/*.sql.gz | docker exec -i sarixgo-restore psql \
            -v ON_ERROR_STOP=1 -U postgres -d postgres
          TABLE_COUNT=$(docker exec sarixgo-restore psql -At -U postgres -d postgres \
            -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")
          test "$TABLE_COUNT" -gt 0 || { echo "::error::Restored backup has no public tables"; exit 1; }

      - name: Upload verified backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/*
          retention-days: 30
          if-no-files-found: error
