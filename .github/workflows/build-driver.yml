name: Build Driver App (Android)

# Free Android APK build using Gradle directly (no EAS cloud quota).
# Produces an installable release APK (debug-signed) as a downloadable artifact.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sarix-go-driver/**'
      - '.github/workflows/build-driver.yml'

jobs:
  build:
    name: Build Sarix Go Driver APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sarix-go-driver
    env:
      EXPO_PUBLIC_API_URL: https://termiz-taxi-production.up.railway.app
      EXPO_PUBLIC_WS_URL: wss://termiz-taxi-production.up.railway.app/ws
      EXPO_PUBLIC_BOT_USERNAME: termizsariosiyotaxi_bot
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (Gradle)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarix-go-driver-apk
          path: sarix-go-driver/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
