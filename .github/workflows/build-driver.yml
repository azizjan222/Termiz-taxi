name: Build Driver App (Android)

# Cloud EAS build. The app is no longer tied to a specific Expo account:
# `eas init` creates/links the project under whatever account the EXPO_TOKEN
# belongs to, then a cloud build runs on that account's (fresh) free quota.
# After it finishes, download the APK from https://expo.dev -> project -> Builds.

on:
  # Manual only. Full native builds are slow and consume EAS build quota.
  # Day-to-day JS/asset changes now ship instantly via the "OTA Update Driver
  # App" workflow. Run THIS workflow only when native code/config changes:
  # new native dependency, app.json plugins/permissions, SDK upgrade, or a
  # version bump (which also requires a fresh build for OTA runtimeVersion).
  workflow_dispatch:

jobs:
  build:
    name: Build Sarix Go Driver
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sarix-go-driver

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Align dependencies to Expo SDK
        run: npx expo install --fix

      - name: Create/link EAS project under your account
        run: eas init --non-interactive --force

      - name: Build APK (cloud, fresh free quota)
        run: eas build --platform android --profile preview --non-interactive
