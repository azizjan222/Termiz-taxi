name: Build Driver App (Android)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-build-driver
  cancel-in-progress: false

jobs:
  build:
    name: Build Sarix Go Driver
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sarix-go-driver
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_DRIVER_PROJECT_ID }}
      EXPO_PUBLIC_YANDEX_JS_API_KEY: ${{ secrets.YANDEX_JS_API_KEY }}
      EXPO_PUBLIC_YANDEX_SDK_API_KEY: ${{ secrets.YANDEX_SDK_API_KEY }}
      GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_DRIVER_JSON_B64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Floating within Node 22 LTS on purpose: eas-cli is installed without a
          # lockfile, so its transitive deps drift. Pinning an exact minor broke CI
          # once @oclif/plugin-autocomplete started requiring Node >=22.
          node-version: '22.x'
          package-manager-cache: false
      - name: Install EAS CLI
        run: npm install -g eas-cli@21.0.1 --no-audit --no-fund
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi
      - name: Restore Firebase client configuration
        run: |
          test -n "$GOOGLE_SERVICES_JSON_B64" || { echo "::error::GOOGLE_SERVICES_DRIVER_JSON_B64 is required"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > google-services.json
      - name: Validate Expo dependencies and project configuration
        run: |
          test -n "$EXPO_PUBLIC_YANDEX_JS_API_KEY" || { echo "::error::YANDEX_JS_API_KEY is required"; exit 1; }
          npx expo install --check
          npx expo config --type public >/dev/null
      - name: Verify source
        run: npm run typecheck && npm run lint && npm test -- --ci
      - name: Build preview APK
        run: eas build --platform android --profile preview --non-interactive --wait
