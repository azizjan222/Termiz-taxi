name: Build Driver App (Android)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-build-driver
  cancel-in-progress: false

jobs:
  build:
    name: Build Sarix Go Driver
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sarix-go-driver
    env:
      EAS_PROJECT_ID: ${{ secrets.EAS_DRIVER_PROJECT_ID }}
      EXPO_PUBLIC_YANDEX_JS_API_KEY: ${{ secrets.YANDEX_JS_API_KEY }}
      EXPO_PUBLIC_YANDEX_SDK_API_KEY: ${{ secrets.YANDEX_SDK_API_KEY }}
      GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_DRIVER_JSON_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: sarix-go-driver/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 21.0.1
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Restore Firebase client configuration
        if: ${{ env.GOOGLE_SERVICES_JSON_B64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > google-services.json
          node -e 'const fs = require("fs"); const config = JSON.parse(fs.readFileSync("google-services.json", "utf8")); const clients = config.client || []; const valid = clients.some(({ client_info: info }) => info?.android_client_info?.package_name === "uz.sarixgo.driver"); if (!valid) throw new Error("google-services.json does not contain the uz.sarixgo.driver Android client");'
      - name: Note preview build without Firebase
        if: ${{ env.GOOGLE_SERVICES_JSON_B64 == '' }}
        run: |
          echo "::warning title=Firebase disabled::GOOGLE_SERVICES_DRIVER_JSON_B64 is not configured. The preview APK will build, but remote push notifications will not work."
          echo "### Firebase disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "This preview APK is built without remote push notifications because \`GOOGLE_SERVICES_DRIVER_JSON_B64\` is not configured. Production releases still require it." >> "$GITHUB_STEP_SUMMARY"
      - name: Validate Expo dependencies and project configuration
        run: |
          test -n "$EAS_PROJECT_ID" || { echo "::error::EAS_DRIVER_PROJECT_ID is required"; exit 1; }
          test -n "$EXPO_PUBLIC_YANDEX_JS_API_KEY" || { echo "::error::YANDEX_JS_API_KEY is required"; exit 1; }
          npx expo install --check
          npx expo config --type public >/dev/null
      - name: Verify source
        run: npm run typecheck && npm run lint && npm test -- --ci
      - name: Build preview APK
        run: eas build --platform android --profile preview --non-interactive --wait
