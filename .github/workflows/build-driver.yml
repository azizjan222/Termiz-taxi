name: Build Driver App (Android)

# Builds the APK with EAS *locally* on the GitHub runner (eas build --local).
# This reuses the proven EAS build config & credentials but runs for FREE on the
# runner, so it does NOT consume the Expo cloud build quota.
# Requires the EXPO_TOKEN repo secret (to fetch Android credentials).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sarix-go-driver/**'
      - '.github/workflows/build-driver.yml'

jobs:
  build:
    name: Build Sarix Go Driver APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sarix-go-driver
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build APK locally (no cloud quota)
        run: |
          eas build --platform android --profile preview --local --non-interactive \
            --output "${GITHUB_WORKSPACE}/sarix-go-driver.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarix-go-driver-apk
          path: ${{ github.workspace }}/sarix-go-driver.apk
          if-no-files-found: error
