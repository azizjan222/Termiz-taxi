name: Release Passenger App (Play Store AAB)

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit this exact build to Google Play"
        type: boolean
        required: false
        default: false
      track:
        # Defaults to `internal` on purpose. Submitting straight to `production` sends the
        # build to every user at once, which is the wrong default for anything that changes
        # how the binary is compiled -- an R8 keep rule that turns out to be too narrow
        # surfaces as a crash on launch, and the internal track is where that should be
        # discovered. Choose `production` deliberately, once a build has been verified.
        description: "Google Play track (verify on internal before production)"
        type: choice
        options:
          - internal
          - production
        required: false
        default: internal

permissions:
  contents: read

concurrency:
  group: eas-release-passenger
  cancel-in-progress: false

jobs:
  release:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: sarix-go-app
    env:
      EAS_PROJECT_ID: ${{ secrets.EAS_PASSENGER_PROJECT_ID }}
      EXPO_PUBLIC_YANDEX_JS_API_KEY: ${{ secrets.YANDEX_JS_API_KEY }}
      EXPO_PUBLIC_YANDEX_GEOCODER_KEY: ${{ secrets.YANDEX_GEOCODER_KEY }}
      EXPO_PUBLIC_YANDEX_MAPS_KEY: ${{ secrets.YANDEX_MAPS_KEY }}
      EXPO_PUBLIC_YANDEX_SUGGEST_KEY: ${{ secrets.YANDEX_SUGGEST_KEY }}
      EXPO_PUBLIC_YANDEX_SDK_API_KEY: ${{ secrets.YANDEX_SDK_API_KEY }}
      GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_PASSENGER_JSON_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Floating within Node 22 LTS on purpose: eas-cli is installed via "yarn add"
          # and no lockfile, so its transitive deps drift. Pinning an exact minor broke
          # CI once @oclif/plugin-autocomplete started requiring Node >=22.
          node-version: '22.x'
          cache: npm
          cache-dependency-path: sarix-go-app/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 21.0.1
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Restore Firebase client configuration
        run: |
          test -n "$GOOGLE_SERVICES_JSON_B64" || { echo "::error::GOOGLE_SERVICES_PASSENGER_JSON_B64 is required"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > google-services.json
          node -e 'const c=require("./google-services.json").client||[]; if(!c.some(x=>x.client_info?.android_client_info?.package_name==="uz.sarixgo.passenger")) throw new Error("Firebase config has no uz.sarixgo.passenger Android client")'
      - name: Sync Firebase configuration to EAS production
        # Use the same authoritative file-variable path as preview builds.
        run: eas env:create --name GOOGLE_SERVICES_JSON --value ./google-services.json --environment production --visibility secret --scope project --type file --force --non-interactive
      - name: Validate and test release source
        run: |
          test -n "$EXPO_PUBLIC_YANDEX_JS_API_KEY" || { echo "::error::YANDEX_JS_API_KEY is required"; exit 1; }
          npx expo install --check
          npx expo config --type public >/dev/null
          npm run typecheck
          npm run lint
          npm test -- --ci
      - name: Report EAS environment variables
        # The app config guard runs on the EAS worker, whose log is not reachable from here,
        # so a missing key used to surface only as an opaque "Read app config" failure.
        # This lists what the production environment actually holds, and with what
        # visibility, before a build slot is spent.
        #
        # Visibility matters: per Expo's docs, `secret` variables are NOT readable during
        # build configuration resolution (nor for bundling JS for updates). EXPO_PUBLIC_*
        # values are embedded in the app in plain text anyway, so `sensitive` is the correct
        # choice for them -- `secret` silently breaks the build instead of protecting it.
        continue-on-error: true
        run: eas env:list --environment production

      - name: Report build inputs
        # google-services.json is .gitignore'd and restored from a secret, so confirm it
        # reached this checkout -- a missing file silently changes the native project.
        continue-on-error: true
        run: |
          if [ -f google-services.json ]; then
            echo "google-services.json: present, sha1=$(sha1sum google-services.json | cut -d' ' -f1)"
          else
            echo "google-services.json: MISSING"
          fi

      - name: Build production AAB
        id: build
        run: |
          # pipefail matters: without it the pipeline reports `tee`'s exit code, so a
          # failed `eas build` looked successful. The explicit status check below is the
          # authoritative signal -- an ERRORED build still emits a valid build id, which
          # is how a hard build failure previously passed as a green release.
          set -o pipefail
          eas build --platform android --profile production --non-interactive --wait --json | tee /tmp/eas-build.json
          BUILD_ID=$(jq -r '.[0].id // empty' /tmp/eas-build.json)
          BUILD_STATUS=$(jq -r '.[0].status // empty' /tmp/eas-build.json)
          test -n "$BUILD_ID" || { echo "::error::Could not determine EAS build ID"; exit 1; }
          if [ "$BUILD_STATUS" != "FINISHED" ]; then
            echo "::error::EAS build $BUILD_ID did not finish (status: $BUILD_STATUS)"
            jq -r '.[0].error // empty' /tmp/eas-build.json
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
      - name: Submit the exact build to Google Play
        if: ${{ inputs.submit }}
        env:
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          TRACK: ${{ inputs.track }}
        run: |
          echo "Submitting build $BUILD_ID to the '$TRACK' track"
          eas submit --platform android --profile "$TRACK" --id "$BUILD_ID" --non-interactive
