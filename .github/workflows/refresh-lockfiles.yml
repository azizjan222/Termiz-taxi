name: Refresh Expo lockfiles

# Regenerates package-lock.json for both Expo apps and lets `expo install --fix`
# correct any dependency that doesn't match the installed Expo SDK.
#
# WHY THIS EXISTS
# ---------------
# Every other workflow installs with `npm ci`, which hard-fails when
# package.json and package-lock.json disagree. After an SDK bump the lockfiles
# must be regenerated with network access to the npm registry. Run this workflow
# once on the upgrade branch; it commits the refreshed package.json +
# package-lock.json back to that branch.
#
# `expo install --fix` is the authority on version ranges: if a hand-edited
# version in package.json is wrong for the SDK, this job rewrites it.
on:
  workflow_dispatch:
    inputs:
      run_checks:
        description: "Run typecheck / lint / tests after installing"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: refresh-lockfiles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'

      - name: Regenerate lockfiles and align versions with the Expo SDK
        run: |
          set -euo pipefail
          for app in sarix-go-app sarix-go-driver; do
            echo "::group::$app"
            cd "$app"

            # Start from a clean slate so npm resolves the new SDK from scratch
            # instead of trying to reconcile the stale tree.
            rm -rf node_modules package-lock.json

            npm install --legacy-peer-deps --no-audit --no-fund

            # Let Expo correct any dependency that is wrong for this SDK.
            npx expo install --fix

            # `expo install --fix` may have rewritten package.json — resync the lock.
            npm install --legacy-peer-deps --no-audit --no-fund

            # Must be clean now, otherwise `npm ci` would fail in the other workflows.
            npx expo install --check

            cd ..
            echo "::endgroup::"
          done

      - name: Verify source
        if: ${{ inputs.run_checks }}
        run: |
          set -euo pipefail
          for app in sarix-go-app sarix-go-driver; do
            echo "::group::checks $app"
            cd "$app"
            npm run typecheck
            npm run lint
            npm test -- --ci
            cd ..
            echo "::endgroup::"
          done

      - name: Commit refreshed lockfiles
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            sarix-go-app/package.json sarix-go-app/package-lock.json \
            sarix-go-driver/package.json sarix-go-driver/package-lock.json

          if git diff --cached --quiet; then
            echo "Lockfiles already up to date — nothing to commit."
            exit 0
          fi

          git commit -m "chore: regenerate Expo lockfiles via expo install --fix"
          git push origin "HEAD:${GITHUB_REF_NAME}"
