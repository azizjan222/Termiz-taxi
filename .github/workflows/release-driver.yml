name: Release Driver App (Play Store AAB)

# Production release build for Google Play. Uses the eas.json `production`
# profile which produces an Android App Bundle (.aab) — the format Play
# requires — with autoIncrement on versionCode.
#
# Two-step flow:
#   1) Build the AAB on EAS cloud (always).
#   2) Optionally submit it to Google Play (only when submit=true).
#
# Submitting requires a Google Play service account JSON configured in EAS
# credentials (or eas.json submit.production.android.serviceAccountKeyPath).
# If that is not set up yet, leave submit=false, download the .aab from
# https://expo.dev -> project -> Builds and upload it manually in Play Console.

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Auto-submit the build to Google Play (needs service account)"
        type: boolean
        required: false
        default: false

jobs:
  release:
    name: Build & (optionally) submit Driver AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sarix-go-driver

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Align dependencies to Expo SDK
        run: npx expo install --fix

      - name: Create/link EAS project under your account
        run: eas init --non-interactive --force

      - name: Build production AAB (cloud)
        run: eas build --platform android --profile production --non-interactive --wait

      - name: Submit to Google Play (production track)
        if: ${{ inputs.submit }}
        run: eas submit --platform android --profile production --latest --non-interactive
