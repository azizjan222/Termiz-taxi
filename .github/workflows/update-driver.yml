# OTA Update Driver App
#
# DISABLED: Over-the-air updates are turned off. expo-updates was removed from the
# app (it was auto-publishing unverified bundles to installed apps on every merge,
# which broke launch/login). This workflow is manual-only and will NOT run on push.
# OTA can be re-enabled later only after a STABLE EAS projectId is committed to
# app.json (extra.eas.projectId) so builds and updates target the same project.
name: OTA Update Driver App (DISABLED)

on:
  # Manual only. Does NOT auto-run on push (that auto-push bricked installed apps).
  workflow_dispatch:
    inputs:
      message:
        description: "Update message"
        required: false
        default: "Manual OTA update"

jobs:
  update:
    name: Publish OTA Update (Driver)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sarix-go-driver

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Align dependencies to Expo SDK
        run: npx expo install --fix

      - name: Link EAS project under your account
        run: eas init --non-interactive --force

      - name: Publish OTA update to the preview channel
        run: |
          eas update --branch preview --non-interactive \
            --message "${{ github.event.inputs.message || github.event.head_commit.message || github.sha }}"
