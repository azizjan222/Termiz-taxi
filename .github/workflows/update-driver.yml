name: OTA Update Driver App

# Manual-only: OTA must be reviewed as JS/assets-only and must pass all checks.
on:
  workflow_dispatch:
    inputs:
      message:
        description: "Update message"
        required: false
        default: "Manual OTA update"

permissions:
  contents: read

concurrency:
  group: eas-update-driver-preview
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sarix-go-driver
    env:
      EAS_PROJECT_ID: ${{ secrets.EAS_DRIVER_PROJECT_ID }}
      EXPO_PUBLIC_YANDEX_JS_API_KEY: ${{ secrets.YANDEX_JS_API_KEY }}
      EXPO_PUBLIC_YANDEX_SDK_API_KEY: ${{ secrets.YANDEX_SDK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: sarix-go-driver/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 21.0.1
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Validate JS-only update
        run: |
          npx expo install --check
          npx expo config --type public >/dev/null
          npm run typecheck
          npm run lint
          npm test -- --ci
      - name: Publish preview update
        env:
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: eas update --branch preview --non-interactive --message "$UPDATE_MESSAGE"
