name: OTA Update Driver App

# Manual-only: OTA must be reviewed as JS/assets-only and must pass all checks.
#
# WHAT AN UPDATE CAN REACH
# ------------------------
# `runtimeVersion` is an explicit string in app.json (currently "3"), NOT a policy. The
# `fingerprint` policy was abandoned because the CI runner and the EAS worker computed
# different hashes for it — see the long comment in sarix-go-driver/app.config.js.
#
# An update is only ever delivered to a build whose runtimeVersion is identical. So native
# changes (new/updated native deps, config plugins, SDK bumps, app config that affects the
# native project) CANNOT ship over OTA: they need a runtimeVersion bump AND a fresh binary
# from build-driver.yml (preview APK) or release-driver.yml (Play Store AAB).
#
# `eas update` does not verify that a build with this runtimeVersion exists — it publishes
# into thin air, prints a green summary and exits 0. Every driver update published between
# 2026-08-29 (runtimeVersion bumped "2" -> "3") and 2026-09-01 reached zero devices that
# way, because the build that would have carried "3" had failed and was never re-run.
# The "Verify a matching build exists" step below is what turns that into a red job.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel that should receive this update"
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production
      message:
        description: "Update message"
        required: false
        default: "Manual OTA update"

permissions:
  contents: read

concurrency:
  group: eas-update-driver-${{ inputs.channel }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sarix-go-driver
    env:
      EAS_PROJECT_ID: ${{ secrets.EAS_DRIVER_PROJECT_ID }}
      EXPO_PUBLIC_YANDEX_JS_API_KEY: ${{ secrets.YANDEX_JS_API_KEY }}
      EXPO_PUBLIC_YANDEX_SDK_API_KEY: ${{ secrets.YANDEX_SDK_API_KEY }}
      GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_DRIVER_JSON_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Floating within Node 22 LTS on purpose: eas-cli is installed via "yarn add"
          # and no lockfile, so its transitive deps drift. Pinning an exact minor broke
          # CI once @oclif/plugin-autocomplete started requiring Node >=22.
          node-version: '22.x'
          cache: npm
          cache-dependency-path: sarix-go-driver/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 21.0.1
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Restore Firebase client configuration
        # app.config.js only sets android.googleServicesFile when the file is present, so
        # restoring it keeps the resolved app config identical to the one the build saw.
        run: |
          test -n "$GOOGLE_SERVICES_JSON_B64" || { echo "::error::GOOGLE_SERVICES_DRIVER_JSON_B64 is required"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > google-services.json
      - name: Validate JS-only update
        run: |
          test -n "$EXPO_PUBLIC_YANDEX_JS_API_KEY" || { echo "::error::YANDEX_JS_API_KEY is required"; exit 1; }
          npx expo install --check
          npx expo config --type public >/dev/null
          npm run typecheck
          npm run lint
          npm test -- --ci
      - name: Verify a matching build exists for this runtimeVersion
        env:
          UPDATE_CHANNEL: ${{ inputs.channel }}
        # Deliberately NOT continue-on-error: an update no binary can receive is a failed
        # release, not a warning. Replaces a `fingerprint:generate` report that was
        # meaningless here — the runtimeVersion is an explicit string, so the fingerprint
        # it printed had no bearing on whether the update would be delivered.
        run: node ../scripts/assert-ota-target-build.mjs "$UPDATE_CHANNEL"
      - name: Publish update
        env:
          UPDATE_MESSAGE: ${{ inputs.message }}
          UPDATE_CHANNEL: ${{ inputs.channel }}
        # --environment is required from SDK 55 onwards, but eas-cli skips that check when
        # it detects CI (environmentFlagNeededForSdk550OrGreater), so omitting it fails
        # silently rather than loudly: the bundle would be built from this runner's env
        # only, while the matching native build takes its values from the EAS environment.
        # Any drift between the two would appear as behaviour that changes after an OTA.
        # The channel and the environment share names by design, see eas.json.
        run: |
          eas update --channel "$UPDATE_CHANNEL" --environment "$UPDATE_CHANNEL" \
            --non-interactive --message "$UPDATE_MESSAGE"
